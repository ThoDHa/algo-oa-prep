site_name: Algo OA Prep Solutions
site_description: Solution write-ups for the Grind 75, NeetCode 150, and Amazon OA problem banks
site_url: https://thodha.github.io/algo-oa-prep/
repo_url: https://github.com/ThoDHa/algo-oa-prep
repo_name: ThoDHa/algo-oa-prep
edit_uri: edit/solutions/docs/
docs_dir: docs
exclude_docs: |
  _TEMPLATE.md

# The practice/ workspace is for local repo use, not the deployed site. A build
# hook strips the per-problem "Practice:" line from rendered pages (it stays in
# the source for repo navigation), so the relative link never reaches the site.
hooks:
  - hooks/strip_practice.py

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.snippets

plugins:
  - search

extra_css:
  - problems/stylesheets/extra.css

